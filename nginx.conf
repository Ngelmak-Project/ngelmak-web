# -------------------------------------------------------
# 🌐 HTTP Server for Angular Frontend (ngelmak.org)
# -------------------------------------------------------
server {
  listen 80;
  server_name ngelmak.org;

  # SSL certificates
  ssl_certificate /etc/nginx/ssl/ngelmak.org/ngelmak.org.pem;
  ssl_certificate_key /etc/nginx/ssl/ngelmak.org/ngelmak.org.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Angular build output
  root /usr/share/nginx/html;
  index index.html;

  # Cache static assets aggressively
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    access_log off;
  }

  # Angular SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# -------------------------------------------------------
# 🔌 HTTPS Server for API (api.ngelmak.org)
# -------------------------------------------------------
server {
  listen 80;
  server_name api.ngelmak.org;

  ssl_certificate /etc/nginx/ssl/ngelmak.org/ngelmak.org.pem;
  ssl_certificate_key /etc/nginx/ssl/ngelmak.org/ngelmak.org.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location / {
    proxy_pass http://ngelmak-gateway:4000;

    # Forward client and protocol information
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Recommended for APIs
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }
}
