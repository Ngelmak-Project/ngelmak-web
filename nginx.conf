# -------------------------------------------------------
# 🌐 HTTPS Server for Angular Frontend (ngelmak.org)
# -------------------------------------------------------
server {
  listen 443 ssl http2;
  server_name ngelmak.org;

  # SSL certificates mounted from host
  ssl_certificate /etc/nginx/ssl/ngelmak.org/ngelmak.org.pem;
  ssl_certificate_key /etc/nginx/ssl/ngelmak.org/ngelmak.org.key;

  # Modern TLS configuration
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Angular build output
  root /usr/share/nginx/html;
  index index.html;

  # Angular SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# -------------------------------------------------------
# 🔌 HTTPS Server for API (api.ngelmak.org)
# -------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name api.ngelmak.org;

  ssl_certificate /etc/nginx/ssl/api.ngelmak.org/api.ngelmak.org.pem;
  ssl_certificate_key /etc/nginx/ssl/api.ngelmak.org/api.ngelmak.org.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Proxy all API traffic to Spring Cloud Gateway
  location / {
    proxy_pass http://ngelmak-gateway:4000;

    # Forward client and protocol information
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# -------------------------------------------------------
# 🔁 Redirect all HTTP traffic to HTTPS
# -------------------------------------------------------
server {
  listen 80;
  server_name ngelmak.org api.ngelmak.org;
  return 301 https://$host$request_uri;
}
