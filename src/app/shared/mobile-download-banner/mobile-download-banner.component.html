<div
  class="fixed inset-x-0 top-0 z-40 pointer-events-none md:relative md:inset-auto"
>
  <div
    class="relative pointer-events-auto mx-auto max-w-7xl bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 border-b border-slate-700/50 dark:border-slate-800 shadow-2xl overflow-hidden"
  >
    <!-- Animated gradient background -->
    <div
      class="absolute inset-0 bg-gradient-to-r from-blue-600/20 via-purple-600/20 to-blue-600/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500"
    ></div>

    <div class="relative px-4 py-4 md:px-6 md:py-5">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 md:gap-6">

        <!-- Left: App Info -->
        <div class="flex items-center gap-4 md:gap-5 flex-1">
          <!-- App Icon -->
          <div class="flex-shrink-0">
            <div class="relative w-14 h-14 md:w-16 md:h-16 rounded-3xl bg-gradient-to-br from-blue-500 to-purple-600 shadow-lg flex items-center justify-center overflow-hidden">
              <svg class="w-8 h-8 md:w-10 md:h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z" />
              </svg>
            </div>
          </div>

          <!-- Text Content -->
          <div class="flex-1 min-w-0">
            <h3 class="text-lg md:text-xl font-bold text-white mb-1">Download Our App</h3>
            <p class="text-sm md:text-base text-slate-300 line-clamp-2">
              Get the best experience on your phone. Sync across all your devices.
            </p>
          </div>
        </div>

        <!-- Right: Action Buttons -->
        <div class="flex gap-2 md:gap-3 flex-shrink-0">
          <!-- App Store -->
          <a
            href="https://apps.apple.com/your-app"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center justify-center gap-2 px-4 md:px-5 py-2.5 md:py-3 bg-white text-slate-900 rounded-lg font-semibold text-sm md:text-base transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M17.05 13.5c-.91 0-1.64.94-1.64 2.05.01 1.12.73 2.05 1.64 2.05.9 0 1.64-.93 1.64-2.05 0-1.11-.74-2.05-1.64-2.05zm4.6-2.5c-.27-.45-.75-.72-1.25-.72h-14c-.5 0-.98.27-1.25.72L1 17v-4c0-.83.67-1.5 1.5-1.5h19c.83 0 1.5.67 1.5 1.5v4l-1.85-6zm-4.6 7.5c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z" />
            </svg>
            <span class="hidden sm:inline">App Store</span>
          </a>

          <!-- Google Play -->
          <a
            href="https://play.google.com/store/apps/details?id=your.app"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center justify-center gap-2 px-4 md:px-5 py-2.5 md:py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-semibold text-sm md:text-base transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M3.609 1.814L13.798 12 3.609 22.186a1.5 1.5 0 0 1-1.286-2.717l9.554-8.47-9.554-8.469a1.5 1.5 0 1 1 1.286-2.716z" />
            </svg>
            <span class="hidden sm:inline">Play Store</span>
          </a>

          <!-- Close Button -->
          <button
            (click)="closeBanner()"
            class="flex-shrink-0 p-2.5 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded-lg transition-colors duration-200"
            aria-label="Close"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Progress indicator (optional) -->
      <div class="absolute bottom-0 left-0 h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-blue-500 opacity-50 w-full"></div>
    </div>
  </div>
</div>
