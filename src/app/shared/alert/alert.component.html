<div
  class="fixed inset-x-0 bottom-0 z-[100] flex flex-col items-center justify-end pointer-events-none"
>
  <div
    [@stagger]="alerts().length"
    class="flex flex-col gap-3 w-full max-w-md md:max-w-lg px-4 md:px-0 pb-4 md:pb-6 pointer-events-auto"
  >
    @for (alert of alerts(); track $index) {
    <div
      class="group relative flex items-center gap-4 w-full p-4 md:p-5 rounded-lg md:rounded-xl shadow-lg md:shadow-xl backdrop-blur-sm border border-white/10 overflow-hidden transition-all duration-300 hover:shadow-2xl"
      [ngClass]="{
        'bg-gradient-to-r from-red-500/15 via-red-500/10 to-transparent border-red-400/30 dark:from-red-600/20 dark:to-transparent dark:border-red-500/40':
          alert.type === 'error',
        'bg-gradient-to-r from-green-500/15 via-green-500/10 to-transparent border-green-400/30 dark:from-green-600/20 dark:to-transparent dark:border-green-500/40':
          alert.type === 'success',
        'bg-gradient-to-r from-amber-500/15 via-amber-500/10 to-transparent border-amber-400/30 dark:from-amber-600/20 dark:to-transparent dark:border-amber-500/40':
          alert.type === 'warning',
        'bg-gradient-to-r from-blue-500/15 via-blue-500/10 to-transparent border-blue-400/30 dark:from-blue-600/20 dark:to-transparent dark:border-blue-500/40':
          alert.type === 'info'
      }"
      @fadeInUp
    >
      <!-- Left accent bar -->
      <div
        class="absolute left-0 top-0 bottom-0 w-1 rounded-full"
        [ngClass]="{
          'bg-red-500': alert.type === 'error',
          'bg-green-500': alert.type === 'success',
          'bg-amber-500': alert.type === 'warning',
          'bg-blue-500': alert.type === 'info'
        }"
      ></div>

      <!-- Icon -->
      @if (alert.showIcon) {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="flex-shrink-0 w-6 h-6 md:w-7 md:h-7 transition-transform group-hover:scale-110"
        [ngClass]="{
          'text-red-500 dark:text-red-400': alert.type === 'error',
          'text-green-500 dark:text-green-400': alert.type === 'success',
          'text-amber-500 dark:text-amber-400': alert.type === 'warning',
          'text-blue-500 dark:text-blue-400': alert.type === 'info'
        }"
      >
        @if (alert.type == 'info') {
        <use href="#info"></use>
        } @if (alert.type == 'error') {
        <use href="#error"></use>
        } @if (alert.type == 'success') {
        <use href="#success"></use>
        } @if (alert.type == 'warning') {
        <use href="#warning"></use>
        }
      </svg>
      }

      <!-- Content -->
      <div class="flex-grow min-w-0">
        <div
          class="text-sm md:text-base font-medium text-gray-900 dark:text-gray-100 break-words"
          [innerHTML]="alert.translationKey ? (alert.translationKey | translate) : alert.message"
        ></div>
      </div>

      <!-- Close button -->
      @if (alert.showCloseButton) {
      <button
        type="button"
        (click)="closeAlert(alert.id)"
        class="flex-shrink-0 ml-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-transparent rounded-md p-1"
        [ngClass]="{
          'focus:ring-red-500': alert.type === 'error',
          'focus:ring-green-500': alert.type === 'success',
          'focus:ring-amber-500': alert.type === 'warning',
          'focus:ring-blue-500': alert.type === 'info'
        }"
        aria-label="Close notification"
      >
        <svg
          class="w-5 h-5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 14 14"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
          />
        </svg>
      </button>
      }
    </div>
    }
  </div>
</div>

<svg style="display: none">
  <defs>
    <symbol id="error" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
      />
    </symbol>
    <symbol id="warning" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"
      />
    </symbol>
    <symbol id="info" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"
      />
    </symbol>
    <symbol id="success" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"
      />
    </symbol>
  </defs>
</svg>
