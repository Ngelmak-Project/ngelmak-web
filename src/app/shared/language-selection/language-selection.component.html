<div
clickOutside
(onClickOutside)="showLangKeyOptions.set(false)"
class="absolute bottom-0 left-0 p-2 w-full flex items-center justify-center"
>
<!-- Your language dropdown kept exactly as is -->
<button
    (click)="showLangKeyOptions.set(!showLangKeyOptions())"
    type="button"
    class="inline-flex justify-center p-2 text-gray-500 rounded cursor-pointer hover:text-gray-900 hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-white"
>
    <svg
    class="w-6 h-6 text-gray-800 dark:text-white"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    >
    <path
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="m13 19 3.5-9 3.5 9m-6.125-2h5.25M3 7h7m0 0h2m-2 0c0 1.63-.793 3.926-2.239 5.655M7.5 6.818V5m.261 7.655C6.79 13.82 5.521 14.725 4 15m3.761-2.345L5 10m2.761 2.655L10.2 15"
    />
    </svg>
</button>

@if (showLangKeyOptions()) {
    <div
    class="absolute bottom-14 z-10 bg-white dark:bg-gray-700 rounded-lg shadow-sm border border-gray-200 dark:border-gray-600"
    >
    <ul class="py-2 w-32 text-sm text-gray-700 dark:text-gray-200">
        <li>
        <button
            type="button"
            (click)="changeLanguage('fr')"
            class="inline-flex w-full px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white"
        >
            <span class="inline-flex items-center gap-2">Français</span>
        </button>
        </li>
        <li>
        <button
            type="button"
            (click)="changeLanguage('en')"
            class="inline-flex w-full px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white"
        >
            <span class="inline-flex items-center gap-2">English</span>
        </button>
        </li>
    </ul>
    </div>
}
</div>
