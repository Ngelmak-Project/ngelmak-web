<!-- PREFERENCES PANEL -->
<div class="fixed right-2 bottom-2">
  <!-- FLOATING BUTTON -->
  <button
    (click)="showPreferences.set(!showPreferences())"
    type="button"
    [ngClass]="{
      'rotate-90': showPreferences()
    }"
    class="z-[9999] rounded-lg w-9 h-9 p-1.5 md:w-10 md:h-10 md:p-2 bg-white/80 dark:bg-gray-800/80 text-gray-700 dark:text-gray-200 hover:bg-white dark:hover:bg-gray-700 shadow-md shadow-gray-300/40 dark:shadow-black/40 transition-transform duration-200 ease-out"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-5 h-5 md:w-6 md:h-6 m-auto transition-transform duration-200 ease-out"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.894.149c-.424.07-.764.383-.929.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.398.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.272-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z"
      />
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
      />
    </svg>
  </button>

  <!-- DROPDOWN -->
  @if (showPreferences()) {
  <div
    @fadeInUp
    clickOutside
    (onClickOutside)="showPreferences.set(false)"
    class="absolute right-0 bottom-12 z-[100] w-64 max-w-[calc(100vw-1rem)] rounded-2xl border border-gray-200/50 dark:border-gray-700/50 bg-white/95 dark:bg-gray-900/95 backdrop-blur-xl shadow-[0_20px_60px_-20px_rgba(0,0,0,0.35)] dark:shadow-[0_20px_60px_-20px_rgba(0,0,0,0.5)] overflow-hidden animate-fadeIn ring-1 ring-black/5 dark:ring-white/10"
  >
    <!-- HEADER (Pro settings title) -->
    <div
      class="px-4 py-3 flex items-center justify-between gap-3 bg-white/60 dark:bg-gray-800/40 border-b border-gray-200/60 dark:border-gray-700/60"
    >
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <h3
            translate="ngelmakTranslation.shared.preferencesPanel.title"
            class="text-sm font-semibold text-gray-900 dark:text-gray-100 truncate"
          >
            Settings
          </h3>
        </div>

        <p
          translate="ngelmakTranslation.shared.preferencesPanel.description"
          class="text-xs text-gray-600 dark:text-gray-300 truncate mt-0.5"
        >
          Language & appearance
        </p>
      </div>

      <button
        type="button"
        (click)="showPreferences.set(false)"
        class="p-2 rounded-lg text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-blue-400/40"
        aria-label="Close preferences"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-4 h-4 shrink-0"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </button>
    </div>

    <!-- LANGUAGE SECTION -->
    <ul class="flex flex-col space-y-1 px-2 py-2">
      @for (language of languages; track $index) {
      <li>
        <button
          type="button"
          (click)="changeLanguage(language.code)"
          [ngClass]="{
            'bg-blue-50 text-blue-600 dark:bg-blue-900/20 dark:text-blue-400':
              lang() === language.code
          }"
          class="w-full flex items-center gap-3 px-3.5 py-2.5 text-sm text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800/50 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-blue-400/40"
        >
          <span class="text-lg">{{ language.flag }}</span>
          <span class="flex-1 text-start font-medium">{{ language.label }}</span>

          @if (lang() === language.code) {
          <svg
            class="w-5 h-5 text-blue-600 dark:text-blue-400"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
              clip-rule="evenodd"
            />
          </svg>
          }
        </button>
      </li>
      }
    </ul>

    <div class="border-t border-gray-200/50 dark:border-gray-700/50"></div>

    <!-- THEME SECTION -->
    <ul class="flex flex-col space-y-1 px-2 py-2">
      <li>
        <button
          type="button"
          (click)="setTheme('light')"
          [ngClass]="{
            'bg-blue-50 text-blue-600 dark:bg-blue-900/20 dark:text-blue-400': theme() === 'light'
          }"
          class="w-full flex items-center gap-3 px-3.5 py-2.5 text-sm text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800/50 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-blue-400/40"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
            />
          </svg>
          <span
            translate="ngelmakTranslation.shared.preferencesPanel.theme.light"
            class="flex-1 text-start font-medium"
            >Light</span
          >

          @if (theme() === 'light') {
          <svg
            class="w-5 h-5 text-blue-600 dark:text-blue-400"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
              clip-rule="evenodd"
            />
          </svg>
          }
        </button>
      </li>

      <li>
        <button
          type="button"
          (click)="setTheme('dark')"
          [ngClass]="{
            'bg-blue-50 text-blue-600 dark:bg-blue-900/20 dark:text-blue-400': theme() === 'dark'
          }"
          class="w-full flex items-center gap-3 px-3.5 py-2.5 text-sm text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800/50 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-blue-400/40"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
            />
          </svg>
          <span
            translate="ngelmakTranslation.shared.preferencesPanel.theme.dark"
            class="flex-1 text-start font-medium"
            >Dark</span
          >

          @if (theme() === 'dark') {
          <svg
            class="w-5 h-5 text-blue-600 dark:text-blue-400"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
              clip-rule="evenodd"
            />
          </svg>
          }
        </button>
      </li>

      <li>
        <button
          type="button"
          (click)="setTheme('system')"
          [ngClass]="{
            'bg-blue-50 text-blue-600 dark:bg-blue-900/20 dark:text-blue-400': theme() === 'system'
          }"
          class="w-full flex items-center gap-3 px-3.5 py-2.5 text-sm text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800/50 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-blue-400/40"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8A2.5 2.5 0 0 1 17.5 17h-11A2.5 2.5 0 0 1 4 14.5v-8Z"
            />
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 20h8" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 17v3" />
          </svg>

          <span
            translate="ngelmakTranslation.shared.preferencesPanel.theme.system"
            class="flex-1 text-start font-medium"
            >System</span
          >

          @if (theme() === 'system') {
          <svg
            class="w-5 h-5 text-blue-600 dark:text-blue-400"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
              clip-rule="evenodd"
            />
          </svg>
          }
        </button>
      </li>
    </ul>
  </div>
  }
</div>
