<div
  @fadeInUp
  class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50"
  clickOutside
  (onClickOutside)="close(false)"
>
  <div
    class="bg-white dark:bg-gray-800 rounded-xl shadow-xl p-6 w-full max-w-sm border border-gray-200 dark:border-gray-700 animate-fadeIn"
  >
    <p class="text-gray-900 dark:text-gray-100 text-sm mb-6">
      {{ message }}
    </p>

    <div class="flex justify-end gap-3">
      <!-- Cancel button -->
      <button
        class="px-4 py-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-sm font-medium transition"
        (click)="close(false)"
      >
        Annuler
      </button>

      <!-- Confirm button -->
      <button
        class="flex gap-1 items-center text-center text-white bg-red-600 border border-red-700 hover:bg-red-700 focus:ring-2 focus:ring-red-200 font-medium rounded-full text-sm px-3 py-1.5 dark:bg-red-700 dark:border-red-800 dark:hover:bg-red-800 dark:focus:ring-red-900 focus:outline-2 focus:outline-dashed focus:outline-red-500 focus:outline-offset-4 disabled:cursor-not-allowed"
        (click)="close(true)"
      >
        Confirmer
      </button>
    </div>
  </div>
</div>
