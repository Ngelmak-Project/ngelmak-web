<div class="w-full">
  <!-- Content -->
  <div
    #contentDiv
    class="relative transition-all duration-500 overflow-hidden"
    [style.max-height]="isExpanded() ? maxHeight + 'px' : clampedHeight + 'px'"
  >
    <p
      class="text-gray-900 dark:text-gray-100 leading-relaxed text-base font-medium whitespace-pre-wrap"
    >
      {{ text() }}
    </p>

    <!-- Better fade gradient (only when collapsed AND text is truncated) -->
    @if (!isExpanded() && shouldShowButton()) {
      <div
        class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-white dark:from-gray-950 via-white/40 dark:via-gray-950/40 to-transparent pointer-events-none shadow-inner rounded-b-xl"
      ></div>
    }
  </div>

  <!-- Button -->
  @if (shouldShowButton()) {
    <button
      (click)="toggleExpand()"
      [attr.aria-expanded]="isExpanded()"
      class="inline-flex items-center text-sm text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300"
    >
      @if (isExpanded()) {
        <span translate="ngelmakTranslation.shared.textCollapse.showLess"></span>
      } @else {
        <span translate="ngelmakTranslation.shared.textCollapse.showMore"></span>
      }
      <svg
        class="w-4 h-4 transition-transform duration-300"
        [class.rotate-180]="isExpanded()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.5"
          d="M19 14l-7 7m0 0l-7-7m7 7V3"
        />
      </svg>
    </button>
  }
</div>
