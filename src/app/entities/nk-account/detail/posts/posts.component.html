<div class="p-4 rounded-lg bg-gray-50 dark:bg-gray-800">
  <h2 class="mb-4 text-3xl font-extrabold leading-none tracking-tight text-gray-900 md:text-4xl dark:text-white">
    Mes publications
  </h2>

  @if (isLoading()) {
  <article class="py-8 animate-pulse">
    <div class="flex flex-col gap-2">
      <div class="flex items-center">
        <a class="inline-flex mr-4" href="#">
          <div class="rounded-full max-w-none w-12 h-12">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="text-gray-200 dark:text-gray-700 size-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
            </svg>
          </div>
        </a>
        <div class="flex flex-col">
          <div class="flex items-center space-x-2">
            <span class="w-28 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
            <span class="w-4 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
            <span class="w-10 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
          </div>
          <div class="inline-flex items-center space-x-1">
            <div class="inline-flex items-center">
              <span class="w-14 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              <span class="w-20 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
            </div>
            <span class="w-1 h-1 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
            <span class="w-16 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
          </div>
        </div>
      </div>
      <div class="inline-flex">
        <span class="w-52 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
        <span class="w-24 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
        <span class="w-16 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
      </div>
    </div>
    <div>
    </div>
    <div class="px-2">
      <div class="flex flex-col space-y-1">
        <span class="w-52 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
        <span class="w-4/5 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
        <span class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
        <span class="w-3/5 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
        <span class="w-2/6 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
        <span class="w-2/3 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
      </div>
    </div>
    <div class="flex justify-between pt-5">
      <div class="inline-flex items-center space-x-2">
        <div class="inline-flex items-center space-x-2 text-gray-200 dark:text-gray-700 p-2">
          <span class="w-4 h-4 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          <span class="w-24 h-4 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          <span class="w-1 h-1 bg-gray-200 dark:bg-gray-700 rounded-full mr-1"></span>
        </div>
        <div class="p-2">
          <span class="w-4 h-4 bg-gray-200 dark:bg-gray-700 block rounded-full"></span>
        </div>
      </div>
      <a class="inline-flex items-center font-medium text-gray-200 dark:text-gray-700">
        <span class="w-24 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
        <span class="w-4 h-4 bg-gray-200 dark:bg-gray-700 block rounded-full"></span>
      </a>
    </div>
  </article>
  } @else {

  @if (posts()?.length > 0) {
  <article *ngFor="let post of posts()" class="py-8">
    <!-- Header -->
    <div class="flex flex-col gap-2">
      <div class="flex items-center">
        <a class="inline-flex mr-4" [routerLink]="['/profile', post.account.name]">
          @if (post.account.avatar) {
          <img [src]="post.account.avatar" alt="Account avatar" class="rounded-full max-w-none w-12 h-12" />
          } @else {
          <div
            class="flex items-center justify-center rounded-full max-w-none w-12 h-12 text-6xl uppercase text-black bg-gray-50 dark:bg-gray-300]">
            {{post.account.name.at(0)}}
          </div>
          }
        </a>
        <div class="flex flex-col">
          <!-- Name and following button -->
          <div class="flex space-x-2">
            <a class="inline-block text-sm font-medium text-gray-900 dark:text-white"
              [routerLink]="['/account', post.account.name ]">{{post.account.name }}</a>
            <svg class="w-5 h-5 text-blue-800" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
              height="24" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd"
                d="M12 2c-.791 0-1.55.314-2.11.874l-.893.893a.985.985 0 0 1-.696.288H7.04A2.984 2.984 0 0 0 4.055 7.04v1.262a.986.986 0 0 1-.288.696l-.893.893a2.984 2.984 0 0 0 0 4.22l.893.893a.985.985 0 0 1 .288.696v1.262a2.984 2.984 0 0 0 2.984 2.984h1.262c.261 0 .512.104.696.288l.893.893a2.984 2.984 0 0 0 4.22 0l.893-.893a.985.985 0 0 1 .696-.288h1.262a2.984 2.984 0 0 0 2.984-2.984V15.7c0-.261.104-.512.288-.696l.893-.893a2.984 2.984 0 0 0 0-4.22l-.893-.893a.985.985 0 0 1-.288-.696V7.04a2.984 2.984 0 0 0-2.984-2.984h-1.262a.985.985 0 0 1-.696-.288l-.893-.893A2.984 2.984 0 0 0 12 2Zm3.683 7.73a1 1 0 1 0-1.414-1.413l-4.253 4.253-1.277-1.277a1 1 0 0 0-1.415 1.414l1.985 1.984a1 1 0 0 0 1.414 0l4.96-4.96Z"
                clip-rule="evenodd" />
            </svg>
          </div>
          <!-- Keywords and publish at -->
          <div class="inline-flex items-center space-x-1">
            <div class="inline-flex items-center space-x-1">
              <span *ngFor="let keyword of post.keywords.split(',')"
                class="bg-blue-100 text-blue-800 text-xs font-medium inline-flex items-center px-2.5 py-0.5 rounded-sm dark:bg-gray-700 dark:text-blue-400 border border-blue-400">
                {{keyword}}
              </span>
            </div>
            <span class="w-1 h-1 bg-gray-600 dark:bg-slate-400 rounded-full mr-1"></span>
            <div class="text-gray-500 dark:text-gray-400">
              {{post.at | duration}}
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Replay to a post content -->
    <div>
    </div>
    <!-- Actual post's content -->
    <div class="px-2">
      <div class="text-black dark:text-gray-200" [innerHTML]="post.content"></div>
    </div>
    <!-- Actions -->
    <div class="flex items-start justify-between pt-5">
      <span
        class="bg-gray-100 text-gray-800 text-sm font-medium inline-flex items-center px-2.5 py-0.5 rounded-md me-2 dark:bg-gray-700 dark:text-gray-400 border border-gray-500">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-5 h-5 me-1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
        </svg>
        <span>{{post.comments?.length}} Commentaire(s)</span>
      </span>
      <div class="flex items-center p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600">
        <a [routerLink]="['/nk-post', post.id, 'edit']"
          class="inline-flex items-center text-blue-700 hover:text-white border border-blue-700 hover:bg-blue-800 focus:ring-2 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-xs px-3 py-2 text-center me-2 mb-2 dark:border-blue-500 dark:text-blue-500 dark:hover:text-white dark:hover:bg-blue-500 dark:focus:ring-blue-800">
          <svg class="w-3 h-3 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z" />
          </svg>
          Modifier
        </a>
        <a [routerLink]="['/nk-post', post.id, 'view']"
          class="inline-flex items-center text-gray-900 hover:text-white border border-gray-800 hover:bg-gray-900 focus:ring-2 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-xs px-3 py-2 text-center me-2 mb-2 dark:border-gray-600 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-800">
          <svg class="w-3 h-3 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-width="2"
              d="M21 12c0 1.2-4.03 6-9 6s-9-4.8-9-6c0-1.2 4.03-6 9-6s9 4.8 9 6Z" />
            <path stroke="currentColor" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
          Consulter
        </a>
        <button type="button"
          class="inline-flex items-center text-red-700 hover:text-white border border-red-700 hover:bg-red-800 focus:ring-2 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-xs px-3 py-2 text-center me-2 mb-2 dark:border-red-500 dark:text-red-500 dark:hover:text-white dark:hover:bg-red-600 dark:focus:ring-red-900">
          <svg class="w-3 h-3 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z" />
          </svg>
          Supprimer
        </button>
      </div>
    </div>
  </article>
  } @else {
  <p class="text-2xl text-gray-500 dark:text-gray-400">Aucun posts.</p>
  }
  }
</div>
