<label
  class="file-picker group relative inline-flex items-center justify-center text-gray-600 dark:text-gray-400 p-2.5 rounded-lg transition-all duration-300"
  [ngClass]="{
    'hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-100/50 dark:hover:bg-blue-900/30 hover:shadow-md':
      !(isDisabled() || isLoading()),
    'cursor-pointer': !(isDisabled() || isLoading()),
    'cursor-not-allowed opacity-50': isDisabled() || isLoading()
  }"
>
  <svg
    class="w-5 h-5 transition-transform duration-300"
    [ngClass]="{
      'group-hover:scale-110': !(isDisabled() || isLoading())
    }"
    fill="currentColor"
    viewBox="0 0 24 24"
  >
    <path
      fill-rule="evenodd"
      d="M13 10a1 1 0 0 1 1-1h.01a1 1 0 1 1 0 2H14a1 1 0 0 1-1-1Z"
      clip-rule="evenodd"
    />
    <path
      fill-rule="evenodd"
      d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12c0 .556-.227 1.06-.593 1.422A.999.999 0 0 1 20.5 20H4a2.002 2.002 0 0 1-2-2V6Zm6.892 12 3.833-5.356-3.99-4.322a1 1 0 0 0-1.549.097L4 12.879V6h16v9.95l-3.257-3.619a1 1 0 0 0-1.557.088L11.2 18H8.892Z"
      clip-rule="evenodd"
    />
  </svg>

  <input
    #fileInput
    type="file"
    class="hidden"
    [accept]="acceptedFileTypes"
    [multiple]="allowMultiple()"
    [disabled]="isDisabled() || isLoading()"
    (change)="onFileSelected($event)"
  />
</label>
