<div
  @fadeInUp
  class="fixed inset-0 bg-black/40  flex items-center justify-center z-40"
>
  <div
    class="bg-white dark:bg-gray-800 rounded-xl shadow-xl p-3 md:p-6 w-full max-w-sm border border-gray-200 dark:border-gray-700"
  >
    <!-- DESCRIPTION -->
    <div class="relative">
      <textarea
        id="content"
        rows="5"
        [field]="ticketForm.description"
        placeholder=" "
        class="block rounded-t-lg px-2.5 pb-2.5 pt-5 w-full text-sm text-gray-900 bg-gray-50 dark:bg-gray-700 border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 focus:outline-none focus:ring-0 focus:border-blue-600 dark:focus:border-blue-500 peer resize-none"
      ></textarea>

      <label
        translate="ngelmakTranslation.entities.ticket.dialog.content.label"
        for="content"
        class="absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] start-2.5 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4"
      >
        Décrivez brièvement le problème ou la situation.
      </label>

      <!-- Wrapper: puts counter on left and errors on right -->
      <div class="flex justify-between items-start mt-1 text-xs w-full">
        <!-- Errors (left side) -->
        <div class="text-left flex-1">
          @if (ticketForm.description().dirty()) {
            @for (error of ticketForm.description().errors(); track error) {
              <p class="text-red-600 dark:text-red-500 text-xs leading-tight">
                {{ error.message | translate }}
              </p>
            }
          }
        </div>
        <!-- Character counter -->
        <div
          class="whitespace-nowrap ml-4"
          [class.text-red-600]="
            ticketForm.description().value().length >= ticketForm.description().maxLength()
          "
          [class.text-gray-500]="
            ticketForm.description().value().length < ticketForm.description().maxLength()
          "
        >
          {{ ticketForm.description().value().length }} /
          {{ ticketForm.description().maxLength() }}
        </div>
      </div>
    </div>

    <!-- EVIDENCE -->
    <div class="mt-4 flex flex-col gap-2">
      <label
        (click)="imgUpload.click()"
        class="flex items-center gap-2 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-md cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600"
      >
        <svg
          class="w-5 h-5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            fill-rule="evenodd"
            d="M13 10a1 1 0 0 1 1-1h.01a1 1 0 1 1 0 2H14a1 1 0 0 1-1-1Z"
            clip-rule="evenodd"
          />
          <path
            fill-rule="evenodd"
            d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12c0 .556-.227 1.06-.593 1.422A.999.999 0 0 1 20.5 20H4a2.002 2.002 0 0 1-2-2V6Zm6.892 12 3.833-5.356-3.99-4.322a1 1 0 0 0-1.549.097L4 12.879V6h16v9.95l-3.257-3.619a1 1 0 0 0-1.557.088L11.2 18H8.892Z"
            clip-rule="evenodd"
          />
        </svg>
        <span translate="ngelmakTranslation.entities.ticket.dialog.attachEvidence"
          >Joindre une preuve (optionnel)</span
        >
      </label>

      <input
        type="file"
        accept=".png, .jpg, .jpeg"
        class="hidden"
        (change)="handleFile($event)"
        #imgUpload
        [disabled]="isSaving()"
      />

      <!-- Preview -->
      @if (ticketModel().evidence) {
        <div class="flex relative max-h-48">
          <img
            class="h-auto rounded-md shadow-xl dark:shadow-gray-800"
            [src]="ticketModel().evidence.url"
            alt="Imported image"
          />

          <button
            type="button"
            (click)="removeFile()"
            [disabled]="isSaving()"
            [hidden]="isSaving()"
            class="ms-auto bg-gray-50 text-gray-500 rounded-lg focus:ring-2 focus:ring-gray-400 p-1.5 hover:bg-gray-200 inline-flex items-center justify-center h-8 w-8 dark:bg-gray-400/80 dark:text-gray-300 dark:hover:bg-gray-700/80 dark:hover:text-white absolute top-2 left-2"
          >
            <svg
              class="w-3 h-3"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 14 14"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
              />
            </svg>
          </button>
        </div>
      }
    </div>

    <!-- ACTIONS -->
    <div class="mt-6 flex justify-end gap-3">
      <!-- Cancel -->
      <button
        translate="ngelmakTranslation.entities.ticket.dialog.cancel"
        type="button"
        (click)="onclose.emit()"
        [disabled]="isSaving()"
        class="px-4 py-2 text-sm rounded-lg border border-gray-300 text-gray-700 bg-white hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-200 dark:border-gray-600 dark:hover:bg-gray-600"
      >
        Annuler
      </button>

      <!-- Submit -->
      <button
        type="button"
        (click)="save()"
        [disabled]="ticketForm().invalid() || isSaving()"
        class="flex gap-2 items-center text-center dark:hover:text-white text-blue-900 bg-white border border-blue-300 focus:outline-none hover:bg-blue-100 focus:ring-4 focus:ring-blue-100 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-blue-800 dark:text-white dark:border-blue-600 dark:hover:bg-blue-700 dark:hover:border-blue-600 dark:focus:ring-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (isSaving()) {
          <svg
            class="inline w-5 h-5 text-gray-200 animate-spin dark:text-gray-600 fill-gray-600 dark:fill-gray-300"
            viewBox="0 0 100 101"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
              fill="currentColor"
            />
            <path
              d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
              fill="currentFill"
            />
          </svg>
        }
        <span translate="ngelmakTranslation.entities.ticket.dialog.send">Envoyer</span>
      </button>
    </div>
  </div>
</div>
