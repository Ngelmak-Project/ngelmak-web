<div class="flex flex-col justify-center">
  <!-- SEARCH BAR -->
  <div
    class="bg-gradient-to-br from-white to-gray-50 dark:from-gray-800 dark:to-gray-900 rounded-none md:rounded-xl lg:rounded-2xl shadow-lg dark:shadow-2xl p-4 sm:p-6 md:border border-gray-100 dark:border-gray-700"
  >
    <form class="w-full flex flex-col sm:flex-row items-stretch sm:items-center gap-2 sm:gap-3">
      <label
        translate="ngelmakTranslation.entities.post.feed.search.label"
        for="voice-search"
        class="sr-only"
        >Rechercher</label
      >
      <div class="relative flex-1 group min-w-0">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 sm:ps-4 pointer-events-none">
          <img
            class="w-4 h-4 sm:w-5 sm:h-5 transition-transform group-focus-within:scale-110"
            src="assets/images/ngelmak-logo-light.svg"
            onerror="
              this.classList.add('hidden');
              this.insertAdjacentHTML(
                'afterend',
                '<span class=\'text-gray-400 dark:text-gray-500 text-base sm:text-lg leading-none\'>🌍</span>',
              );
            "
          />
        </div>
        <input
          [value]="query()"
          (input)="query.set($any($event.target).value)"
          type="text"
          id="voice-search"
          class="bg-white dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 text-gray-900 dark:text-white text-sm sm:text-base rounded-lg sm:rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none block w-full ps-10 sm:ps-12 pr-10 sm:pr-12 py-2.5 sm:py-3 transition-all duration-200 dark:placeholder-gray-400 placeholder:text-gray-400"
          placeholder="{{ 'ngelmakTranslation.entities.post.feed.search.placeholder' | translate }}"
          required
        />
        @if (query()) {
          <button
            (click)="query.set('')"
            type="button"
            class="absolute inset-y-0 end-0 flex items-center pe-3 sm:pe-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors duration-150"
            aria-label="Clear search"
          >
            <svg
              class="w-4 h-4 sm:w-5 sm:h-5"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18 17.94 6M18 18 6.06 6"
              />
            </svg>
          </button>
        }
      </div>
      <button
        type="button"
        (click)="search()"
        [disabled]="!validForSearch()"
        class="inline-flex items-center justify-center gap-1 py-2.5 sm:py-3 px-4 sm:px-6 text-xs sm:text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-blue-700 rounded-lg sm:rounded-xl border border-blue-700 hover:from-blue-700 hover:to-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:from-blue-600 dark:to-blue-700 dark:hover:from-blue-700 dark:hover:to-blue-800 dark:focus:ring-blue-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 shadow-md hover:shadow-lg whitespace-nowrap flex-shrink-0"
        [attr.aria-busy]="isLoading()"
      >
        @if (isSearching()) {
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        } @else {
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
            />
          </svg>
        }
        <span translate="ngelmakTranslation.entities.post.feed.search.submit"> Rechercher </span>
      </button>
    </form>
  </div>

  <!-- POST UPDATE -->
  <app-post-update (onsaved)="handlePostSaved($event)" class="mt-6" />

  <!-- POST CARDS -->
  <div class="flex flex-col gap-2 md:gap-4 mt-6">
    @for (post of feeds(); track $index) {
      <app-post-card [post]="post" (ondeleted)="handlePostDeleted($event)" />
    }
  </div>

  <!-- LOADING SPINNER -->
  @if (isLoading()) {
    <article class="py-8 animate-pulse">
      <div class="flex flex-col gap-2">
        <div class="flex items-center">
          <a class="inline-flex mr-4" href="#">
            <div class="rounded-full max-w-none w-12 h-12">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="text-gray-200 dark:text-gray-700 size-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
                />
              </svg>
            </div>
          </a>
          <div class="flex flex-col w-full">
            <div class="flex w-1/2 items-center space-x-1 md:space-x-2">
              <span
                class="w-1/2 md:w-1/2 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"
              ></span>
              <span class="w-2 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              <span class="w-5 md:w-10 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
            </div>
            <div class="flex items-center space-x-1 md:space-x-2">
              <span class="w-2/6 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              <span class="w-3/6 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              <span class="w-1 h-1 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              <span class="w-1/6 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
            </div>
          </div>
        </div>
        <div class="inline-flex">
          <span class="w-1/2 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
          <span class="w-1/4 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
          <span class="w-1/4 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
        </div>
      </div>
      <div></div>
      <div class="px-2">
        <div class="flex flex-col space-y-1">
          <span class="w-4/5 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          <span class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          <span class="w-3/5 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          <span class="w-2/6 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          <span class="w-2/3 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
        </div>
      </div>
    </article>
  }

  <!-- SENTINEL (invisible) -->
  <div class="h-1" appVisibleTrigger (visible)="handleScrollEnd()"></div>
</div>
