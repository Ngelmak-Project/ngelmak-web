<div class="flex flex-col justify-center">
  <!-- POST UPDATE -->
  <app-post-update (onsaved)="handlePostSaved($event)" />

  <nav
    class="sticky -top-1 md:-top-3 lg:-top-6 z-40 px-1 md:px-2 md:mt-6 w-full bg-white/50 dark:bg-gray-900/60 backdrop-blur-lg shadow-sm overflow-visible"
  >
    <div class="flex items-center justify-center py-4 md:py-5">
      <div
        class="relative grid grid-cols-4 gap-0 md:gap-1 p-1 bg-gray-50/60 dark:bg-slate-800/50 rounded-xl backdrop-blur-md border border-gray-200/40 dark:border-slate-700/40 w-full place-items-center"
      >
        <button
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="group relative w-full h-full flex items-center justify-center px-2.5 sm:px-4 py-2 rounded-lg font-semibold text-[11px] sm:text-base transition-all duration-300 cursor-pointer [&.active]:bg-blue-100 dark:[&.active]:bg-blue-950 whitespace-nowrap leading-none"
        >
          <span
            translate="ngelmakTranslation.entities.post.feed.navigation.feed"
            class="relative text-gray-600 dark:text-gray-400 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors duration-300 [&.active]:text-blue-700 dark:[&.active]:text-blue-300"
          >
            Feed
          </span>
          <span
            class="absolute -bottom-1 left-1/2 -translate-x-1/2 h-0.5 w-0 bg-blue-600 dark:bg-blue-400 rounded-full group-hover:w-8 group-[&.active]:w-8 transition-all duration-300"
          ></span>
        </button>

        <a
          routerLink="/week"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="group relative w-full h-full flex items-center justify-center px-2.5 sm:px-4 py-2 rounded-lg font-semibold text-[11px] sm:text-base transition-all duration-300 cursor-pointer [&.active]:bg-blue-100 dark:[&.active]:bg-blue-950 whitespace-nowrap leading-none"
        >
          <span
            translate="ngelmakTranslation.entities.post.feed.navigation.week"
            class="relative text-gray-600 dark:text-gray-400 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors duration-300 [&.active]:text-blue-700 dark:[&.active]:text-blue-300"
          >
            This Week
          </span>
          <span
            class="absolute -bottom-1 left-1/2 -translate-x-1/2 h-0.5 w-0 bg-blue-600 dark:bg-blue-400 rounded-full group-hover:w-8 group-[&.active]:w-8 transition-all duration-300"
          ></span>
        </a>

        <a
          routerLink="/month"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="group relative w-full h-full flex items-center justify-center px-2.5 sm:px-4 py-2 rounded-lg font-semibold text-[11px] sm:text-base transition-all duration-300 cursor-pointer [&.active]:bg-purple-100 dark:[&.active]:bg-purple-950 whitespace-nowrap leading-none"
        >
          <span
            translate="ngelmakTranslation.entities.post.feed.navigation.month"
            class="relative text-gray-600 dark:text-gray-400 group-hover:text-purple-600 dark:group-hover:text-purple-400 transition-colors duration-300 [&.active]:text-purple-700 dark:[&.active]:text-purple-300"
          >
            This Month
          </span>
          <span
            class="absolute -bottom-1 left-1/2 -translate-x-1/2 h-0.5 w-0 bg-purple-600 dark:bg-purple-400 rounded-full group-hover:w-8 group-[&.active]:w-8 transition-all duration-300"
          ></span>
        </a>

        <a
          routerLink="/trending"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="group relative w-full h-full flex items-center justify-center px-2.5 sm:px-4 py-2 rounded-lg font-semibold text-[11px] sm:text-base transition-all duration-300 cursor-pointer [&.active]:bg-orange-100 dark:[&.active]:bg-orange-950 whitespace-nowrap leading-none"
        >
          <span
            translate="ngelmakTranslation.entities.post.feed.navigation.trending"
            class="relative text-gray-600 dark:text-gray-400 group-hover:text-orange-600 dark:group-hover:text-orange-400 transition-colors duration-300 [&.active]:text-orange-700 dark:[&.active]:text-orange-300"
          >
            Trending
          </span>
          <span
            class="absolute -bottom-1 left-1/2 -translate-x-1/2 h-0.5 w-0 bg-orange-600 dark:bg-orange-400 rounded-full group-hover:w-8 group-[&.active]:w-8 transition-all duration-300"
          ></span>
        </a>
      </div>
    </div>
  </nav>

  <div class="min-h-screen">
    <router-outlet></router-outlet>
  </div>
</div>
