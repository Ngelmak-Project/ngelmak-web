<div class="flex flex-col justify-center">
  <!-- SEARCH BAR -->
  <div
    class="bg-gradient-to-br from-white to-gray-50 dark:from-gray-800 dark:to-gray-900 rounded-none md:rounded-xl lg:rounded-2xl shadow-sm dark:shadow-2xl p-4 sm:p-6 md:border border-gray-100 dark:border-gray-700"
  >
    <form class="w-full flex flex-col sm:flex-row items-stretch sm:items-center gap-2 sm:gap-3">
      <label
        translate="ngelmakTranslation.entities.post.feed.search.label"
        for="voice-search"
        class="sr-only"
        >Rechercher</label
      >
      <div class="relative flex-1 group min-w-0">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 sm:ps-4 pointer-events-none">
          <img
            class="w-4 h-4 sm:w-5 sm:h-5 transition-transform group-focus-within:scale-110"
            src="assets/images/ngelmak-logo-light.svg"
            onerror="
              this.classList.add('hidden');
              this.insertAdjacentHTML(
                'afterend',
                '<span class=\'text-gray-400 dark:text-gray-500 text-base sm:text-lg leading-none\'>🌍</span>',
              );
            "
          />
        </div>
        <input
          [value]="query()"
          (input)="query.set($any($event.target).value)"
          type="text"
          id="voice-search"
          class="bg-white dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 text-gray-900 dark:text-white text-sm sm:text-base rounded-lg sm:rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none block w-full ps-10 sm:ps-12 pr-10 sm:pr-12 py-2.5 sm:py-3 transition-all duration-200 dark:placeholder-gray-400 placeholder:text-gray-400"
          placeholder="{{ 'ngelmakTranslation.entities.post.feed.search.placeholder' | translate }}"
          required
        />
        @if (query()) {
          <button
            (click)="query.set(''); handleNavigation()"
            type="button"
            class="absolute inset-y-0 end-0 flex items-center pe-3 sm:pe-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors duration-150"
            aria-label="Clear search"
          >
            <svg
              class="w-4 h-4 sm:w-5 sm:h-5"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18 17.94 6M18 18 6.06 6"
              />
            </svg>
          </button>
        }
      </div>
      <button
        type="button"
        (click)="search()"
        [disabled]="!validForSearch()"
        class="inline-flex items-center justify-center gap-1 py-2.5 sm:py-3 px-4 sm:px-6 text-xs sm:text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-blue-700 rounded-lg sm:rounded-xl border border-blue-700 hover:from-blue-700 hover:to-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:from-blue-600 dark:to-blue-700 dark:hover:from-blue-700 dark:hover:to-blue-800 dark:focus:ring-blue-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 shadow-md hover:shadow-sm whitespace-nowrap flex-shrink-0"
        [attr.aria-busy]="isLoading()"
      >
        @if (isSearching()) {
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        } @else {
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
            />
          </svg>
        }
        <span translate="ngelmakTranslation.entities.post.feed.search.submit"> Rechercher </span>
      </button>
    </form>
  </div>

  <!-- POST UPDATE -->
  <app-post-update (onsaved)="handlePostSaved($event)" class="mt-6" />

  <nav
    class="sticky -top-1 md:-top-3 lg:-top-6 z-40 px-1 md:px-2 md:mt-6 w-full bg-white/50 dark:bg-gray-900/60 backdrop-blur-lg shadow-sm overflow-visible"
  >
    <div class="flex items-center justify-center py-4 md:py-5">
      <div
        class="relative grid grid-cols-4 gap-0 md:gap-1 p-1 bg-gray-50/60 dark:bg-slate-800/50 rounded-xl backdrop-blur-md border border-gray-200/40 dark:border-slate-700/40 w-full place-items-center"
      >
        <button
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="group relative w-full h-full flex items-center justify-center px-2.5 sm:px-4 py-2 rounded-lg font-semibold text-[11px] sm:text-base transition-all duration-300 cursor-pointer [&.active]:bg-blue-100 dark:[&.active]:bg-blue-950 whitespace-nowrap leading-none"
        >
          <span
            translate="ngelmakTranslation.entities.post.feed.navigation.feed"
            class="relative text-gray-600 dark:text-gray-400 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors duration-300 [&.active]:text-blue-700 dark:[&.active]:text-blue-300"
          >
            Feed
          </span>
          <span
            class="absolute -bottom-1 left-1/2 -translate-x-1/2 h-0.5 w-0 bg-blue-600 dark:bg-blue-400 rounded-full group-hover:w-8 group-[&.active]:w-8 transition-all duration-300"
          ></span>
        </button>

        <a
          routerLink="/week"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="group relative w-full h-full flex items-center justify-center px-2.5 sm:px-4 py-2 rounded-lg font-semibold text-[11px] sm:text-base transition-all duration-300 cursor-pointer [&.active]:bg-blue-100 dark:[&.active]:bg-blue-950 whitespace-nowrap leading-none"
        >
          <span
            translate="ngelmakTranslation.entities.post.feed.navigation.weed"
            class="relative text-gray-600 dark:text-gray-400 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors duration-300 [&.active]:text-blue-700 dark:[&.active]:text-blue-300"
          >
            This Week
          </span>
          <span
            class="absolute -bottom-1 left-1/2 -translate-x-1/2 h-0.5 w-0 bg-blue-600 dark:bg-blue-400 rounded-full group-hover:w-8 group-[&.active]:w-8 transition-all duration-300"
          ></span>
        </a>

        <a
          routerLink="/month"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="group relative w-full h-full flex items-center justify-center px-2.5 sm:px-4 py-2 rounded-lg font-semibold text-[11px] sm:text-base transition-all duration-300 cursor-pointer [&.active]:bg-purple-100 dark:[&.active]:bg-purple-950 whitespace-nowrap leading-none"
        >
          <span
            translate="ngelmakTranslation.entities.post.feed.navigation.month"
            class="relative text-gray-600 dark:text-gray-400 group-hover:text-purple-600 dark:group-hover:text-purple-400 transition-colors duration-300 [&.active]:text-purple-700 dark:[&.active]:text-purple-300"
          >
            This Month
          </span>
          <span
            class="absolute -bottom-1 left-1/2 -translate-x-1/2 h-0.5 w-0 bg-purple-600 dark:bg-purple-400 rounded-full group-hover:w-8 group-[&.active]:w-8 transition-all duration-300"
          ></span>
        </a>

        <a
          routerLink="/trending"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="group relative w-full h-full flex items-center justify-center px-2.5 sm:px-4 py-2 rounded-lg font-semibold text-[11px] sm:text-base transition-all duration-300 cursor-pointer [&.active]:bg-orange-100 dark:[&.active]:bg-orange-950 whitespace-nowrap leading-none"
        >
          <span
            translate="ngelmakTranslation.entities.post.feed.navigation.trending"
            class="relative text-gray-600 dark:text-gray-400 group-hover:text-orange-600 dark:group-hover:text-orange-400 transition-colors duration-300 [&.active]:text-orange-700 dark:[&.active]:text-orange-300"
          >
            Trending
          </span>
          <span
            class="absolute -bottom-1 left-1/2 -translate-x-1/2 h-0.5 w-0 bg-orange-600 dark:bg-orange-400 rounded-full group-hover:w-8 group-[&.active]:w-8 transition-all duration-300"
          ></span>
        </a>
      </div>
    </div>
  </nav>

  <div class="min-h-screen">
    <router-outlet></router-outlet>
  </div>
</div>
