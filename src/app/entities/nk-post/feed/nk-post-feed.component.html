<div class="flex flex-col justify-center gap-6">
  <!-- SEARCH BAR -->
  <div class="bg-white dark:bg-gray-800">
    <form class="w-full flex items-center py-2">
      <label translate="ngelmakTranslation.entities.post.feed.search.label" for="voice-search" class="sr-only"
        >Rechercher</label
      >
      <div class="relative w-full">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <img
            class="w-5 h-5"
            src="assets/images/ngelmak-logo-light.svg"
            onerror="
              this.classList.add('hidden');
              this.insertAdjacentHTML(
                'afterend',
                '<span class=\'text-gray-500 text-lg leading-none\'>🌍</span>',
              );
            "
          />
        </div>
        <input
          [value]="query()"
          (input)="query.set($any($event.target).value)"
          type="text"
          id="voice-search"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-gray-500 focus:border-gray-500 block w-full ps-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-gray-500 dark:focus:border-gray-500"
          placeholder="{{ 'ngelmakTranslation.entities.post.feed.search.placeholder' | translate }}"
          required
        />
        @if (query()) {
          <button
            (click)="query.set('')"
            type="button"
            class="absolute inset-y-0 end-0 flex items-center pe-3"
          >
            <svg
              class="w-5 h-5 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18 17.94 6M18 18 6.06 6"
              />
            </svg>
          </button>
        }
      </div>
      <button
        type="button"
        (click)="search()"
        [disabled]="!hasMinimumQueryLength()"
        class="inline-flex items-center py-2.5 px-3 ms-2 text-sm font-medium text-white bg-blue-700 rounded-lg border border-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 disabled:opacity-50 disabled:hover:bg-blue-700 disabled:hover:border-blue-700"
      >
        <svg
          class="w-4 h-4 me-2"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 20 20"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
          />
        </svg>
        <span translate="ngelmakTranslation.entities.post.feed.search.submit">Rechercher</span>
      </button>
    </form>
  </div>
  <app-post-update (onsaved)="handlePostSaved($event)"></app-post-update>

  <!-- FEED -->
  <div class="flex flex-col gap-4 divide-y divide-gray-200 dark:divide-gray-700">
    @for (post of feeds(); track $index) {
      <app-post-card [post]="post"></app-post-card>
    }
  </div>

  <!-- LOADING SPINNER -->
  @if (isLoading()) {
    <article class="py-8 animate-pulse">
      <div class="flex flex-col gap-2">
        <div class="flex items-center">
          <a class="inline-flex mr-4" href="#">
            <div class="rounded-full max-w-none w-12 h-12">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="text-gray-200 dark:text-gray-700 size-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
                />
              </svg>
            </div>
          </a>
          <div class="flex flex-col w-full">
            <div class="flex w-1/2 items-center space-x-1 md:space-x-2">
              <span
                class="w-1/2 md:w-1/2 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"
              ></span>
              <span class="w-2 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              <span class="w-5 md:w-10 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
            </div>
            <div class="flex items-center space-x-1 md:space-x-2">
              <span class="w-2/6 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              <span class="w-3/6 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              <span class="w-1 h-1 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
              <span class="w-1/6 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
            </div>
          </div>
        </div>
        <div class="inline-flex">
          <span class="w-1/2 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
          <span class="w-1/4 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
          <span class="w-1/4 h-4 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
        </div>
      </div>
      <div></div>
      <div class="px-2">
        <div class="flex flex-col space-y-1">
          <span class="w-4/5 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          <span class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          <span class="w-3/5 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          <span class="w-2/6 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          <span class="w-2/3 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
        </div>
      </div>
    </article>
  }

  <!-- SENTINEL (invisible) -->
  <div class="h-1" appVisibleTrigger (visible)="handleScrollEnd()"></div>
</div>
