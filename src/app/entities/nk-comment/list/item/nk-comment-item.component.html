<div
  class="relative flex flex-col gap-2 transition-colors hover:bg-gray-100 dark:hover:bg-gray-800 rounded-bl-lg"
  [ngClass]="{
    'pl-1': level === 0,
    'pl-3': level === 1,
    'pl-5': level >= 2,
    'border-l border-gray-300 dark:border-gray-700': replies().length > 0,
  }"
>
  <div class="flex flex-row gap-2">
    @if (level < 2) {
      <div class="shrink-0">
        <!-- Avatar -->
        <a
          [routerLink]="[
            'nk-account',
            comment.account?.id + '-' + comment.account?.identifier,
            'view',
          ]"
        >
          @if (comment.account?.avatar) {
            <img
              [src]="comment.account?.avatar"
              alt="Account avatar"
              class="rounded-full max-w-none w-6 h-6"
            />
          } @else {
            <div
              class="flex items-center justify-center rounded-full max-w-none w-6 h-6 text-xl uppercase text-black bg-gray-50 dark:bg-gray-300]"
            >
              {{ comment.account?.name.at(0) }}
            </div>
          }
        </a>
      </div>
    }

    <div class="flex flex-col w-full gap-2">
      <!-- Account info -->
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-500">@{{ comment.account?.name }}</span>
      </div>

      <!-- Content -->
      <p class="text-gray-900 dark:text-white">
        <!-- @if (level > 0) {
          <span class="text-blue-600 dark:text-blue-400 font-medium">
            @{{ comment.replyTo?.account?.name }}
          </span>
        } -->
        <span [innerHTML]="comment.content"></span>
      </p>

      <!-- Actions -->
      <div class="flex items-center gap-3 text-xs text-gray-500 dark:text-gray-400">
        <app-comment-reaction-dialog [comment]="comment"></app-comment-reaction-dialog>

        <button class="font-medium hover:underline" (click)="isReplying.set(!isReplying())">
          Répondre
        </button>

        <span>{{ comment.at | duration }}</span>

        @if (comment.replyCount > 0) {
          <button
            (click)="toggleReplies()"
            [disabled]="isLoading()"
            class="ml-auto flex items-center justify-center gap-1 hover:underline"
          >
            @if (isLoading()) {
              <svg
                class="inline w-4 h-w-4 text-gray-200 animate-spin dark:text-gray-600 fill-gray-600 dark:fill-gray-300"
                viewBox="0 0 100 101"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                  fill="currentColor"
                />
                <path
                  d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                  fill="currentFill"
                />
              </svg>
            }
            {{ comment.replyCount }} replies
          </button>
        }
      </div>

      @if (isReplying()) {
        <app-comment-update
          [replyTo]="comment"
          (onSaveSuccess)="onReply($event)"
        ></app-comment-update>
      }

      @if (showReplies()) {
        <div class="flex flex-col gap-2">
          @for (replyComment of replies(); track $index) {
            <app-comment-item [comment]="replyComment" [level]="level + 1"></app-comment-item>
          }
        </div>
      }
    </div>
  </div>
</div>
