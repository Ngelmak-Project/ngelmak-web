<div
  class="flex flex-col gap-3 w-full mx-auto bg-white dark:bg-gray-800 rounded-xl p-3 border border-gray-200 dark:border-gray-700"
>
  <!-- Comment box only for logged-in users -->
  <app-comment-update
    *hasAnyAuthority="'ROLE_USER'"
    [post]="postSig()"
    [withAttach]="true"
    (oncomment)="onComment($event)"
  ></app-comment-update>

  <!-- If user is NOT logged in -->
  <div
    translate="ngelmakTranslation.entities.comment.list.signInToComment"
    *hasNoAuthority="'ROLE_USER'"
    class="text-gray-500 dark:text-gray-400 text-sm italic px-1"
  >
    Connectez-vous pour commenter.
  </div>

  <!-- Comments list -->
  <div class="flex flex-col gap-9 mt-1">
    @if (isLoading()) {
      <div class="flex animate-pulse gap-4 items-start">
        <div class="w-10 h-10 rounded-full bg-gray-300 dark:bg-gray-700"></div>
        <div class="flex-1 space-y-3">
          <div class="h-3 rounded bg-gray-300 dark:bg-gray-700 w-1/3"></div>
          <div class="h-3 rounded bg-gray-300 dark:bg-gray-700 w-2/3"></div>
          <div class="h-3 rounded bg-gray-300 dark:bg-gray-700 w-1/2"></div>
        </div>
      </div>
    } @else if (comments()?.length === 0) {
      <div
        translate="ngelmakTranslation.entities.comment.list.noComments"
        class="text-gray-500 dark:text-gray-400 text-sm italic px-1"
      >
        Aucun commentaire pour le moment.
      </div>
    }

    <!-- Comments -->
    @for (comment of comments(); track $index) {
      <app-comment-item
        [comment]="comment"
        [level]="0"
        (ondelete)="onDeleted($event)"
      ></app-comment-item>
    }
  </div>
  @if (hasNext()) {
    <button
      (click)="loadNext()"
      [disabled]="isLoading() || !hasNext()"
      class="inline-flex items-center space-x-1 mx-auto text-xs text-gray-500 dark:text-gray-400 font-medium hover:underline"
    >
      @if (isLoading()) {
        <svg
          class="inline w-5 h-5 text-gray-200 animate-spin dark:text-gray-600 fill-gray-600 dark:fill-gray-300"
          viewBox="0 0 100 101"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
            fill="currentColor"
          />
          <path
            d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
            fill="currentFill"
          />
        </svg>
      }
      <span translate="ngelmakTranslation.entities.comment.list.loadMore">Plus de commentaires</span>
    </button>
  }
</div>
