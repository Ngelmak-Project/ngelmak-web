<div class="flex flex-col gap-2 w-full mx-auto bg-white dark:bg-gray-800 rounded-xl">
  <app-comment-update [post]="postSig()" (onSaveSuccess)="onComment($event)"></app-comment-update>

  <div class="flex flex-col gap-4">
    @for (comment of comments(); track $index) {
      <app-comment-item [comment]="comment" [level]="0" (onDeleted)="onDeleted($event)"></app-comment-item>
    }
  </div>
</div>
