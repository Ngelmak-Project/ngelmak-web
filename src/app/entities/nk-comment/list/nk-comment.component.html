<div class="flex flex-col gap-3 w-full mx-auto bg-white dark:bg-gray-800 rounded-xl p-3 border border-gray-200 dark:border-gray-700">
  <!-- Comment box only for logged-in users -->
  <app-comment-update
    *hasAnyAuthority="'ROLE_USER'"
    [post]="postSig()"
    [withAttach]="true"
    (oncomment)="onComment($event)"
  ></app-comment-update>

  <!-- If user is NOT logged in -->
  <div
    *hasNoAuthority="'ROLE_USER'"
    class="text-gray-500 dark:text-gray-400 text-sm italic px-1"
  >
    Connectez-vous pour commenter.
  </div>

  <!-- Comments list -->
  <div class="flex flex-col gap-9 mt-1">
    @if (isLoading()) {
      <div class="flex animate-pulse gap-4 items-start">
        <div class="w-10 h-10 rounded-full bg-gray-300 dark:bg-gray-700"></div>
        <div class="flex-1 space-y-3">
          <div class="h-3 rounded bg-gray-300 dark:bg-gray-700 w-1/3"></div>
          <div class="h-3 rounded bg-gray-300 dark:bg-gray-700 w-2/3"></div>
          <div class="h-3 rounded bg-gray-300 dark:bg-gray-700 w-1/2"></div>
        </div>
      </div>
    } @else if (comments()?.length === 0) {
      <div class="text-gray-500 dark:text-gray-400 text-sm italic px-1">
        Aucun commentaire pour le moment.
      </div>
    }

    <!-- Comments -->
    @for (comment of comments(); track $index) {
      <app-comment-item
        [comment]="comment"
        [level]="0"
        (ondelete)="onDeleted($event)"
      ></app-comment-item>
    }
  </div>
</div>
