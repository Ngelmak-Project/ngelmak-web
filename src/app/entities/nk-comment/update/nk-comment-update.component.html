<div
  class="w-full mb-4 bg-gradient-to-br from-white via-gray-50 to-gray-100 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 border-transparent border-gray-200 dark:border-gray-700 rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 p-4"
>
  <!-- TEXTAREA -->
  <textarea
    [field]="commentForm.content"
    id="content"
    rows="3"
    class="w-full p-3 text-sm text-gray-600 dark:text-white font-medium bg-white/70 dark:bg-gray-800/70 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-400 dark:focus:ring-blue-500 focus:border-blue-400 dark:focus:border-blue-500 placeholder-gray-400 dark:placeholder-gray-500 transition-all duration-300 overflow-auto"
    placeholder="{{ 'ngelmakTranslation.entities.comment.update.content.placeholder' | translate }}"
  ></textarea>

  <!-- ERRORS + COUNTER -->
  <div class="flex justify-between items-start text-xs w-full mt-2">
    <div class="text-left flex-1">
      @if (commentForm.content().dirty()) { @for (error of commentForm.content().errors(); track
      error) {
      <p class="text-red-600 dark:text-red-500 leading-tight">
        {{ error.message | translate }}
      </p>
      } }
    </div>

    <div
      class="whitespace-nowrap ml-4"
      [class.text-red-600]="
        commentForm.content().value().length >= commentForm.content().maxLength()
      "
      [class.text-gray-500]="
        commentForm.content().value().length < commentForm.content().maxLength()
      "
    >
      {{ commentForm.content().value().length }} / {{ commentForm.content().maxLength() }}
    </div>
  </div>

  <!-- IMAGE PREVIEW -->
  @if (selectedFile()) {
  <app-image-viewer [images]="[selectedFile()]" (ondelete)="removeFile($event)" />
  }

  <!-- ACTIONS -->
  <div class="flex items-center justify-between flex-wrap pt-3">
    <div class="flex flex-wrap gap-2">
      <!-- SAVE -->
      <button
        (click)="save()"
        [disabled]="commentForm().invalid() || isSaving()"
        class="inline-flex items-center text-white bg-gradient-to-r from-blue-500 to-blue-600 dark:from-blue-600 dark:to-blue-700 hover:from-blue-600 hover:to-blue-700 border border-blue-500 dark:border-blue-600 shadow-md hover:shadow-lg rounded-xl text-sm px-4 py-2 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (isSaving()) {
        <svg class="w-4 h-4 animate-spin relative z-10" fill="none" viewBox="0 0 24 24">
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        } @if (comment()?.id) {
        <span translate="ngelmakTranslation.entities.comment.update.saveUpdate">Modifier</span>
        } @else {
        <span translate="ngelmakTranslation.entities.comment.update.savePublish">Publier</span>
        }
      </button>

      <!-- CANCEL -->
      <button
        (click)="cancel()"
        [disabled]="isSaving()"
        translate="ngelmakTranslation.entities.comment.update.cancel"
        class="text-gray-600 dark:text-gray-300 bg-white/60 dark:bg-gray-700/60 border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-2 text-sm hover:bg-gray-200 dark:hover:bg-gray-600 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Annuler
      </button>
    </div>

    <!-- Image Upload Button -->
    @if (withAttach()) {
    <app-file-picker
      [allowMultiple]="false"
      [isDisabled]="isSaving()"
      [fileCategories]="['image']"
      (filesSelected)="addFiles($event)"
    />
    }
  </div>
</div>
