<div
  class="w-full mb-4 border border-gray-200 rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600"
>
  <div class="flex flex-col gap-1 lg:gap-2 p-2 bg-white rounded-t-lg dark:bg-gray-800">
    <label for="content" class="sr-only">Tapez votre commentaire!</label>
    <textarea
      [field]="commentForm.content"
      id="content"
      rows="2"
      class="w-full px-0 text-sm text-gray-900 bg-white border-0 dark:bg-gray-800 focus:ring-0 dark:text-white dark:placeholder-gray-400 overflow-auto"
      placeholder="Tapez votre commentaire!"
    ></textarea>

    <!-- Wrapper: puts counter on left and errors on right -->
    <div class="flex justify-between items-start text-xs w-full">
      <!-- Errors (left side) -->
      <div class="text-left flex-1">
        @if (commentForm.content().dirty()) {
          @for (error of commentForm.content().errors(); track error) {
            <p class="text-red-600 dark:text-red-500 text-xs leading-tight">
              {{ error.message }}
            </p>
          }
        }
      </div>
      <!-- Character counter -->
      <div
        class="whitespace-nowrap ml-4"
        [class.text-red-600]="
          commentForm.content().value().length >= commentForm.content().maxLength()
        "
        [class.text-gray-500]="
          commentForm.content().value().length < commentForm.content().maxLength()
        "
      >
        {{ commentForm.content().value().length }} / {{ commentForm.content().maxLength() }}
      </div>
    </div>

    <!-- JOINED FILES -->
    @if (commentModel().file != null) {
      <div class="flex relative max-h-48">
        <img
          class="h-auto rounded-md shadow-xl dark:shadow-gray-800"
          [src]="commentModel().file.url"
          alt="Imported image"
        />

        <button
          type="button"
          (click)="remove()"
          [disabled]="isSaving()"
          [hidden]="isSaving()"
          class="ms-auto bg-gray-50 text-gray-500 rounded-lg focus:ring-2 focus:ring-gray-400 p-1.5 hover:bg-gray-200 inline-flex items-center justify-center h-8 w-8 dark:bg-gray-400 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white absolute top-2 left-2"
        >
          <svg
            class="w-3 h-3"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 14 14"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
            />
          </svg>
        </button>
      </div>
    }
  </div>

  <!-- ACTIONS BUTTONS -->
  <div class="flex items-center justify-between flex-wrap border-t dark:border-gray-600 border-gray-200 p-1">
    <!-- api call/cancel button -->
    <div class="flex flex-wrap gap-1">
      <!-- SAVE -->
      <button
        (click)="save()"
        [disabled]="commentForm().invalid() || isSaving()"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-2 focus:ring-blue-300 font-medium rounded-lg text-sm px-3 py-1.5 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (isSaving()) {
          <svg
            class="inline w-4 h-4 text-gray-200 animate-spin dark:text-gray-600 fill-gray-600 dark:fill-gray-300"
            viewBox="0 0 100 101"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
              fill="currentColor"
            />
            <path
              d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
              fill="currentFill"
            />
          </svg>
        }
        {{ comment()?.id ? 'Modifier' : 'Publier' }}
      </button>
      <!-- CANCEL -->
      <button
        annuler
        (click)="cancel()"
        [disabled]="isSaving()"
        type="button"
        class="text-gray-500 rounded-lg focus:ring-2 focus:ring-gray-400 hover:bg-gray-200 px-3 py-1.5 text-sm dark:hover:bg-gray-600 dark:text-gray-300 dark:hover:text-white disabled:cursor-not-allowed disabled:opacity-50"
      >
        Annuler
      </button>
    </div>

    <!-- upload image -->
    @if (withAttach()) {
      <label
        (click)="imgUpload.click()"
        class="inline-flex justify-center p-0.5 text-gray-500 rounded-md cursor-pointer hover:text-gray-900 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600"
      >
        <svg
          class="w-6 h-6 text-gray-800 dark:text-white"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            fill-rule="evenodd"
            d="M13 10a1 1 0 0 1 1-1h.01a1 1 0 1 1 0 2H14a1 1 0 0 1-1-1Z"
            clip-rule="evenodd"
          />
          <path
            fill-rule="evenodd"
            d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12c0 .556-.227 1.06-.593 1.422A.999.999 0 0 1 20.5 20H4a2.002 2.002 0 0 1-2-2V6Zm6.892 12 3.833-5.356-3.99-4.322a1 1 0 0 0-1.549.097L4 12.879V6h16v9.95l-3.257-3.619a1 1 0 0 0-1.557.088L11.2 18H8.892Z"
            clip-rule="evenodd"
          />
        </svg>

        <input
          type="file"
          accept=".png, .jpg, .jpeg"
          class="hidden"
          (change)="handleFile($event)"
          #imgUpload
          [disabled]="isSaving()"
        />
      </label>
    }
  </div>
</div>
