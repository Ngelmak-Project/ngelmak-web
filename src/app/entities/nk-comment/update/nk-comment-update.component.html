<div #nkeditor
  class="flex flex-col gap-2 w-full leading-1.5 min-w-[14rem] px-2 sm:px-4 py-2.5 border-gray-200 bg-gray-100 rounded-xl dark:bg-gray-700">
  <div class="flex items-end gap-2 rtl:space-x-reverse">
    <div class="flex justify-center items-center w-12 h-12">
      <label (click)="fileUpload.click()"
        class="inline-flex justify-center p-2 text-gray-500 rounded-lg cursor-pointer hover:text-gray-900 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600">
        <svg class="w-4 h-4 sm:w-6 sm:h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 18">
          <path fill="currentColor"
            d="M13 5.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0ZM7.565 7.423 4.5 14h11.518l-2.516-3.71L11 13 7.565 7.423Z" />
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M18 1H2a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1Z" />
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 5.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0ZM7.565 7.423 4.5 14h11.518l-2.516-3.71L11 13 7.565 7.423Z" />
        </svg>
        <input type="file" accept=".png, .jpg, .jpeg" class="hidden"
          (change)="handleImage($event)" #fileUpload [disabled]="isSaving()" />
      </label>
    </div>
    <!-- Input text -->
    <div
      class="inline-flex items-center w-full min-h-12 max-h-24 overflow-y-auto
        bg-gray-50 border dark:border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-600 border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 p-0">
      <p class="nk-editor w-full p-2 outline-none break-words rounded-sm placeholder relative resize-none m-0"
        contenteditable="true" data-placeholder="Commentaire...">
      </p>
    </div>
    <div class="flex justify-center items-center w-12 h-12">
      <button (click)="save()" [disabled]="isEmpty() || isSaving()"
        class="inline-flex justify-center p-2 text-gray-500 rounded-lg cursor-pointer hover:text-gray-900 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600 disabled:cursor-not-allowed"
        type="button">
        <svg class="w-4 h-4 sm:w-6 sm:h-6 rotate-90 rtl:-rotate-90" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
          fill="currentColor" viewBox="0 0 18 20">
          <path
            d="m17.914 18.594-8-18a1 1 0 0 0-1.828 0l-8 18a1 1 0 0 0 1.157 1.376L8 18.281V9a1 1 0 0 1 2 0v9.281l6.758 1.689a1 1 0 0 0 1.156-1.376Z" />
        </svg>
      </button>
    </div>
  </div>
  <div *ngIf="imageSrc()" class="flex relative max-h-48">
    <img class="h-auto rounded-lg shadow-xl dark:shadow-gray-800" [src]="imageSrc()"
      alt="Imported image">

    <button type="button" (click)="remove()" [disabled]="isSaving()"
      class="ms-auto -mx-1.5 -my-1.5 bg-gray-50 text-gray-500 rounded-lg focus:ring-2 focus:ring-gray-400 p-1.5 hover:bg-gray-200 inline-flex items-center justify-center h-8 w-8 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white absolute top-2 right-2"
      data-dismiss-target="#alert-5" aria-label="Close">
      <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
      </svg>
    </button>
  </div>
</div>
