<div class="flex flex-col gap-2 w-full mx-auto bg-white dark:bg-gray-800 rounded-xl">
  <div class="flex flex-col gap-4">
    @for (contactMessage of contactMessages(); track $index) {
      <app-contact-message-item [contactMessage]="contactMessage" [level]="0" (onDeleted)="onDeleted($event)"></app-contact-message-item>
    }
  </div>
</div>
