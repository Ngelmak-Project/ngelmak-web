<div class="relative w-full h-full" clickOutside (onClickOutside)="isOpen.set(false)">
  <!-- Reaction button -->
  <button
    (click)="toggle()"
    [disabled]="isSaving() || !activeChannel()"
    class="h-full w-full inline-flex items-center justify-center space-x-1.5 px-2.5 py-1.5 rounded-lg font-medium transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
    [ngClass]="
      isSaving()
        ? 'animate-pulse'
        : 'bg-gradient-to-br from-gray-200 to-gray-100 hover:from-gray-100 hover:to-gray-150 dark:from-gray-700 dark:to-gray-600 dark:hover:from-gray-600 dark:hover:to-gray-700 hover:shadow-sm active:scale-95'
    "
  >
    @if (totalReactions() > 0) {
      @for (emoji of emojiReactions(); track $index) {
        <span class="text-lg leading-none transition-transform hover:scale-110">
          {{ emoji }}
        </span>
      }
      <span
  class="ml-1 px-2.5 py-1 text-xs font-semibold
         text-gray-600 dark:text-gray-300
         bg-white dark:bg-gray-800
         rounded-full"
>
  {{ totalReactions() }}
</span>

    } @else {
      <span class="text-lg leading-none transition-transform hover:scale-110">👍</span>
    }
  </button>

  <!-- Emoji popup - Horizontal alignment -->
  @if (isOpen()) {
    <div
      class="absolute bottom-full left-0 mb-2 z-50 animate-in fade-in zoom-in-95 duration-200 origin-bottom-left"
    >
      <div
        class="px-3 py-2  bg-white/95 dark:bg-gray-800/95 border border-gray-200/50 dark:border-gray-700/50 rounded-xl shadow-lg shadow-black/10 dark:shadow-black/40"
      >
        <div class="flex gap-1.5">
          @for (emoji of emojis; track $index) {
            <button
              (click)="select(emoji)"
              [disabled]="isSaving()"
              class="inline-flex items-center justify-center w-9 h-9 transition-all duration-200 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed"
              [ngClass]="{
                'bg-gradient-to-br from-blue-100 to-blue-50 dark:from-blue-900/30 dark:to-blue-800/20 ring-2 ring-blue-400/50 dark:ring-blue-500/50 scale-110':
                  emoji === reactedByCurrentUser(),
                'hover:scale-125 hover:bg-gray-100 dark:hover:bg-gray-700/50 active:scale-100':
                  emoji !== reactedByCurrentUser() && !isSaving(),
              }"
            >
              <span class="text-2xl leading-none select-none">{{ emoji }}</span>
            </button>
          }
        </div>
      </div>
    </div>
  }
</div>
