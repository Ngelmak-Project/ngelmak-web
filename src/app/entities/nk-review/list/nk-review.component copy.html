<div class="space-y-4 max-h-[600px] overflow-y-auto pr-2">
  @for (review of reviews(); track $index) {
    <div
      class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800"
    >
      <!-- Header -->
      <div class="flex items-center justify-between">
        <h3 class="font-medium text-gray-900 dark:text-white">
          {{ review.author }}
        </h3>
        <span class="text-xs text-gray-500 dark:text-gray-400">
          {{ review.createdAt | date:'short' }}
        </span>
      </div>

      <!-- Reply context -->
      <p
        *ngIf="review.replyTo"
        class="text-xs text-gray-500 dark:text-gray-400 mt-1"
      >
        En réponse à {{ review.replyTo.author }}
      </p>

      <!-- Content -->
      <p class="mt-2 text-gray-700 dark:text-gray-300">
        {{ review.content }}
      </p>

      <!-- Reply button -->
      <button
        class="mt-3 text-sm text-blue-600 dark:text-blue-400 hover:underline"
        (click)="replyTo(review)"
      >
        Répondre
      </button>

    </div>
  }

</div>
