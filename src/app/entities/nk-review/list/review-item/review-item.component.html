<div class="flex flex-col gap-1">
  <!-- Header -->
  <div class="flex items-center gap-2" [ngClass]="{ 'self-end text-right': review().isAuthor }">
    <span class="font-medium text-gray-900 dark:text-white">
      {{ review().author }}
    </span>

    <span class="text-xs text-gray-500 dark:text-gray-400">
      {{ review().createdAt | formatMediumDatetime }}
    </span>
  </div>

  <!-- Message -->
  <div
    class="rounded-md p-3 max-w-[85%]"
    [ngClass]="{
      'self-end bg-blue-100 dark:bg-blue-900/20': review().isAuthor,
      'self-start bg-sky-50 dark:bg-blue-500/10': !review().isAuthor,
    }"
  >
    <!-- Reply context -->
    @if (review().replyTo) {
      <div
        class="text-xs text-gray-800 dark:text-gray-200 mb-2 pl-2 border-l border-gray-800 dark:border-gray-200"
      >
        <span translate="ngelmakTranslation.entities.review.list.item.replyTo">En réponse à</span>
        <span class="font-medium">{{ review().replyTo.author }}</span
        ><br />
        <span class="italic opacity-80 line-clamp-1">
          {{ review().replyTo.content }}
        </span>
      </div>
    }

    <!-- Content -->
    <div class="text-gray-800 dark:text-gray-200" [innerHTML]="review().content"></div>
  </div>

  <!-- Actions -->
  @if (!ticket().resolved) {
    <div
      class="flex gap-3 text-xs"
      [ngClass]="{ 'self-end': review().isAuthor, 'self-start': !review().isAuthor }"
    >
      <button
        translate="ngelmakTranslation.entities.review.list.item.reply"
        (click)="reply()"
        [disabled]="isDeleting()"
        class="text-blue-600 dark:text-blue-400 hover:underline disabled:opacity-50"
      >
        Répondre
      </button>

      @if (review().isAuthor) {
        <button
          translate="ngelmakTranslation.entities.review.list.item.update"
          (click)="update()"
          [disabled]="isDeleting()"
          class="text-gray-500 dark:text-gray-400 hover:underline disabled:opacity-50"
        >
          Modifier
        </button>

        <button
          (click)="openConfirmDialog.set(true)"
          [disabled]="isDeleting()"
          class="text-red-500 dark:text-red-400 hover:underline disabled:opacity-50"
        >
          @if (isDeleting()) {
            <svg
              aria-hidden="true"
              class="inline w-3 h-3 animate-spin text-gray-400 dark:text-gray-200 fill-red-600"
              viewBox="0 0 100 101"
            >
              <path
                d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908Z"
                fill="currentColor"
              />
              <path
                d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                fill="currentFill"
              />
            </svg>
          }
          <span translate="ngelmakTranslation.entities.review.list.item.delete">Supprimer</span>
        </button>
      }
    </div>
  }

  <!-- Review dialog -->
  @if (openReview()) {
    <app-review-dialog
      [ticket]="ticket()"
      [review]="replyTo() ? null : review()"
      [replyTo]="replyTo()"
      (onclose)="onCreated($event)"
    />
  }

  <!-- Delete confirmation -->
  @if (openConfirmDialog()) {
    <app-confirm-dialog
      variant="danger"
      title="Suppression d'un message"
      message="Voulez-vous supprimer votre message ?"
      (confirm)="deleteReview($event)"
    />
  }
</div>
