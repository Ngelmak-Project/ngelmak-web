<div class="flex flex-col space-y-4 px-5 pb-4">
  <!-- Review update form -->
  @if (reviews().length == 0) {
    <app-review-update *hasNoAuthority="['ROLE_ADMIN', 'ROLE_MODERATOR']" [ticket]="ticket()" />
  }

  <!-- Review items -->
  @for (review of reviews(); track $index) {
    <app-review-item [ticket]="ticket()" [review]="review" />
  }

  @if (!ticket().resolved) {
    <button
      (click)="openReview.set(true)"
      class="ml-auto inline-flex items-center justify-between px-4 py-2 text-sm rounded-lg text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600"
    >
      <span translate="entities.review.list.addReview">Ajouter un commentaire</span>
      <svg
        class="w-5 h-5 text-gray-800 dark:text-white"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 17h6l3 3v-3h2V9h-2M4 4h11v8H9l-3 3v-3H4V4Z"
        />
      </svg>
    </button>
  }

  <!-- Review dialog -->
  @if (openReview()) {
    <app-review-dialog [ticket]="ticket()" (onclose)="onCreated($event)" />
  }
</div>
