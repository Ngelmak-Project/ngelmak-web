<div class="max-h-[600px] overflow-y-auto space-y-6 px-5">
  @for (review of reviews(); track $index) {
    <div class="flex flex-col gap-1">
      <!-- Header -->
      <div class="flex items-center gap-2">
        <span class="font-medium text-gray-900 dark:text-white">
          {{ review.author }}
        </span>
        <span class="text-xs text-gray-500 dark:text-gray-400">
          {{ review.createdAt | date: 'short' }}
        </span>
      </div>

      <!-- Reply context -->
      <div
        *ngIf="review.replyTo"
        class="text-xs text-gray-500 dark:text-gray-400 pl-3 border-l border-gray-300 dark:border-gray-600"
      >
        En réponse à <span class="font-medium">{{ review.replyTo.author }}</span>
      </div>

      <!-- Content -->
      <div
        class="pl-3 border-l-2 border-blue-300 dark:border-blue-600 text-gray-800 dark:text-gray-200"
      >
        {{ review.content }}
      </div>

      <!-- Reply button -->
      <button
        class="self-start text-sm text-blue-600 dark:text-blue-400 hover:underline mt-1"
        (click)="replyTo.set(review)"
      >
        Répondre
      </button>
    </div>
  }

  @if (replyTo()) {
    <app-review-dialog
      [ticket]="ticket()"
      [replyTo]="replyTo()"
      (onclose)="onReplied($event)"
    ></app-review-dialog>
  }
</div>
