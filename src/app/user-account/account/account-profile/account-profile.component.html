<div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
  <div class="relative">
    <img [src]="account().banner" class="w-full h-40 object-cover rounded-lg" />

    <img [src]="account().avatar"
         class="w-24 h-24 rounded-full border-4 border-white dark:border-gray-800 absolute -bottom-8 left-6" />
  </div>

  <div class="mt-12 px-2">
    <h2 class="text-xl font-semibold text-gray-900 dark:text-white">
      {{ account().name }}
    </h2>
    <p class="text-gray-500 dark:text-gray-400">
      {{ account().description }}
    </p>

    <button
      routerLink="/security/profile"
      class="mt-4 inline-flex items-center px-3 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700">
      Modifier le profil
    </button>
  </div>
</div>
