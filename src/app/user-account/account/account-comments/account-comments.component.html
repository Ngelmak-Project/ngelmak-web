<div class="p-4 rounded-lg bg-gray-50 dark:bg-gray-800">
  <h2
    class="mb-4 text-3xl font-extrabold leading-none tracking-tight text-gray-900 md:text-4xl dark:text-white"
  >
    Mes commentaires
  </h2>

  <div class="flex flex-col gap-6 divide-y divide-gray-200 dark:divide-gray-700">
    @for (comment of comments(); track $index) {
      <app-comment-item @fadeInUp [comment]="comment"></app-comment-item>
    }
    @if (isLoading()) {
      <article class="py-8 animate-pulse">
        <div class="flex flex-col gap-2">
          <div class="flex items-center">
            <div class="flex flex-col w-full">
              <div class="flex w-1/2 items-center space-x-1 md:space-x-2">
                <span
                  class="w-1/2 md:w-1/2 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"
                ></span>
                <span class="w-2 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"></span>
                <span
                  class="w-5 md:w-10 h-2 bg-gray-200 dark:bg-gray-700 mb-2.5 rounded-full"
                ></span>
              </div>
            </div>
          </div>
        </div>
        <div class="px-2">
          <div class="flex flex-col space-y-1">
            <span class="w-4/5 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
            <span class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
            <span class="w-3/5 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
            <span class="w-2/6 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
            <span class="w-2/3 h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></span>
          </div>
        </div>
      </article>
    }
  </div>
</div>
