<div class="flex flex-col items-center justify-center px-6 pt-8 mx-auto md:h-screen pt:mt-0 dark:bg-gray-900">
  <a href="" class="flex items-center justify-center mb-8 text-2xl font-semibold lg:mb-10 dark:text-white">
    <img src="assets/images/logo.svg" class="mr-4 h-11" alt="FlowBite Logo" />
    <span>Ngelmak</span>
  </a>
  <!-- Card -->
  <div class="w-full max-w-lg p-6 space-y-8 sm:p-8 bg-white rounded-lg shadow dark:bg-gray-800">
    <h1 class="text-4xl py-4 text-center font-bold text-gray-900 dark:text-slate-200">
      Activation de compte
    </h1>
    <div class="text-slate-500">
      @if (success()) {
      <div class="justify-center items-center w-full max-h-full">
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
          <div class="p-4 md:p-5 text-center">
            <svg class="mx-auto mb-4 text-gray-400 w-12 h-12 dark:text-gray-200" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11h2v5m-2 0h4m-2.592-8.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
            </svg>
            <h3
              class="bg-blue-100 text-blue-800 text-md font-medium me-2 px-2.5 py-4 rounded dark:bg-gray-700 dark:text-blue-400 border border-blue-400">
              <span><strong>Votre compte utilisateur a été activé.</strong>
                Veuillez vous </span>
              <a class="text-blue-400 underline" routerLink="/sign-in">enregistrer</a>.
            </h3>
          </div>
        </div>
      </div>
      }
      @if (error()) {
      <div class="justify-center items-center w-full max-h-full">
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
          <div class="p-4 md:p-5 text-center">
            <svg class="mx-auto mb-4 text-red-400 w-12 h-12 dark:text-red-200" aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
            <h3
              class="bg-red-100 text-red-800 text-sm font-medium me-2 px-2.5 py-0.5 rounded dark:bg-gray-700 dark:text-red-400 border border-red-400">
              <strong>Votre utilisateur n'a pas pu
                être activé.</strong> Veuillez utiliser le formulaire d'enregistrement pour vous inscrire.
            </h3>
            <a routerLink="/sign-in" type="button"
              class="text-white bg-blue-600 hover:bg-blue-800 focus:ring-2 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 text-center">
              M'inscrire
              <svg class="w-4 h-4 ms-3 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 14 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M1 5h12m0 0L9 1m4 4L9 9" />
              </svg>
            </a>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</div>
