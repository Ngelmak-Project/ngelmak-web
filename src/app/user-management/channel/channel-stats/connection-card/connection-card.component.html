<article
  class="group flex items-center justify-between p-4 rounded-2xl
         bg-gradient-to-br from-white via-gray-50 to-gray-100
         dark:from-gray-900 dark:via-gray-800 dark:to-gray-900
         border border-gray-200 dark:border-gray-700
         shadow-lg hover:shadow-2xl hover:border-gray-300
         dark:hover:border-gray-600 transition-all duration-300">

  <!-- LEFT: USER INFO -->
  <div class="flex items-center gap-4 flex-1 min-w-0">

    <!-- AVATAR -->
    <a [routerLink]="['/channel', channel()?.identifier, 'view']"
       class="relative shrink-0 group/avatar">

      <div class="absolute inset-0 rounded-full blur-lg
                  bg-gradient-to-r from-blue-400 to-purple-500
                  opacity-0 group-hover/avatar:opacity-50
                  transition-opacity duration-300">
      </div>

      @if (channel()?.avatar) {
        <img
          [src]="channel().avatar"
          [alt]="channel().name"
          class="relative w-16 h-16 rounded-full object-cover
                 ring-2 ring-white dark:ring-gray-800 shadow-md
                 transition-transform duration-300 group-hover/avatar:scale-110" />
      } @else {
        <div
          class="relative w-16 h-16 rounded-full
                 bg-gradient-to-br from-blue-400 to-purple-500
                 flex items-center justify-center
                 text-white font-bold text-xl
                 ring-2 ring-white dark:ring-gray-800 shadow-md">
          {{ channel?.name?.charAt(0)?.toUpperCase() }}
        </div>
      }
    </a>

    <!-- NAME + IDENTIFIER + STATS -->
    <div class="flex flex-col min-w-0 flex-1 gap-2">

      <!-- NAME -->
      <a
        [routerLink]="['/channel', channel()?.identifier, 'view']"
        class="font-bold text-gray-900 dark:text-white text-base
               hover:text-blue-600 dark:hover:text-blue-400
               transition-colors truncate">
        {{ channel?.name }}
      </a>

      <!-- IDENTIFIER -->
      <span class="text-sm font-medium text-gray-500 dark:text-gray-400">
        @{{ channel()?.identifier }}
      </span>

      <!-- STATS -->
      @if (channel()?.stats) {
        <div class="flex items-center gap-4 text-xs text-gray-600 dark:text-gray-400">

          <!-- POSTS -->
          <span class="flex items-center gap-1">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10.5 1.5H5.75A2.25 2.25 0 003.5 3.75v12.5A2.25 2.25 0 005.75 18.5h8.5a2.25 2.25 0 002.25-2.25V6.5m-12-5h12m-12 0v5m12-5v5" />
            </svg>
            {{ channel().stats.postCount || 0 }}
            <span translate="ngelmakTranslation.userManagement.channel.connections.posts">posts</span>
          </span>

          <!-- FOLLOWERS -->
          <span class="flex items-center gap-1">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10 2a4 4 0 100 8 4 4 0 000-8zM2.5 16a2 2 0 00-2 2h17a2 2 0 00-2-2h-13z" />
            </svg>
            {{ 0 }}
            <span translate="ngelmakTranslation.userManagement.channel.connections.followers">followers</span>
          </span>
        </div>
      }
    </div>
  </div>

  <!-- RIGHT: ACTION BUTTON -->
  <button
    [disabled]="isToggling()"
    (click)="toggleSubscription.emit()"
    class="shrink-0 inline-flex items-center gap-2 px-4 py-2.5
           rounded-full text-xs font-semibold border-2
           transition-all duration-200 disabled:opacity-50
           disabled:cursor-not-allowed"
    [ngClass]="{
      'bg-gradient-to-r from-blue-500 to-blue-600 text-white border-blue-600 dark:border-blue-500 hover:shadow-lg hover:shadow-blue-500/50': !isFollowing,
      'bg-white dark:bg-gray-800 text-gray-900 dark:text-white border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700': isFollowing
    }">

    @if (isToggling()) {
      <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10"
                stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    } @else {

      @if (isFollowing()) {
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
          <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v1h8v-1zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z" />
        </svg>
        <span translate="ngelmakTranslation.userManagement.channel.connections.following">Following</span>
      } @else {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 4v16m8-8H4" />
        </svg>
        <span translate="ngelmakTranslation.userManagement.channel.connections.follow">Follow</span>
      }
    }
  </button>
</article>
