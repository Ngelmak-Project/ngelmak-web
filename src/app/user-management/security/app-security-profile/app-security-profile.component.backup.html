<section class="w-full dark:bg-gray-900 p-6">
  <!-- PERSONAL INFO CARD -->
  <div
    class="p-8 rounded-2xl bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-800 dark:to-gray-900 border border-gray-200 dark:border-gray-700 shadow-lg"
  >
    <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-8">Personal Information</h2>

    <div class="flex flex-col sm:flex-row gap-8 mb-8">
      <!-- AVATAR -->
      <div class="relative w-full h-auto mx-auto sm:w-48 sm:h-48 flex-shrink-0">
        <div
          class="w-full h-48 rounded-2xl bg-gradient-to-br from-blue-400 to-purple-500 p-1 shadow-xl"
        >
          <img
            src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=256&h=256&q=80"
            alt="Profile"
            class="w-full h-full object-cover rounded-xl dark:border-gray-700"
          />
        </div>

        <!-- Edit actions -->
        <div class="absolute bottom-4 right-4 flex justify-end gap-3">
          <!-- Upload button -->
          <button
            class="bg-green-500 hover:bg-green-600 text-white p-3 rounded-full shadow-lg transition-all duration-200 hover:scale-110"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
              ></path>
            </svg>
          </button>

          <!-- Edit button -->
          <button
            class="bg-blue-500 hover:bg-blue-600 text-white p-3 rounded-full shadow-lg transition-all duration-200 hover:scale-110"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
              ></path>
            </svg>
          </button>

          <!-- Cancel button -->
          <button
            class="bg-red-500 hover:bg-red-600 text-white p-3 rounded-full shadow-lg transition-all duration-200 hover:scale-110"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- TEXT FIELDS -->
      <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-6">
        <!-- First Name -->
        <div class="space-y-2">
          <label
            class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide"
            >First Name</label
          >
          <input
            type="text"
            placeholder="John"
            class="w-full px-4 py-3 rounded-lg bg-white dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 text-gray-900 dark:text-white focus:border-blue-500 focus:outline-none transition-colors"
          />
        </div>

        <!-- Last Name -->
        <div class="space-y-2">
          <label
            class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide"
            >Last Name</label
          >
          <input
            type="text"
            placeholder="Doe"
            class="w-full px-4 py-3 rounded-lg bg-white dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 text-gray-900 dark:text-white focus:border-blue-500 focus:outline-none transition-colors"
          />
        </div>

        <!-- Language -->
        <div class="space-y-2">
          <label
            class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide"
            >Preferred Language</label
          >
          <select
            class="w-full px-4 py-3 rounded-lg bg-white dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 text-gray-900 dark:text-white focus:border-blue-500 focus:outline-none transition-colors"
          >
            <option>English</option>
            <option>Français</option>
            <option>Español</option>
            <option>Deutsch</option>
          </select>
        </div>

        <!-- Theme -->
        <div class="space-y-2">
          <label
            class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide"
            >Theme</label
          >
          <div class="flex gap-3 pt-2">
            <button
              class="flex-1 px-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-600 hover:bg-gray-200 dark:hover:bg-gray-500 text-gray-900 dark:text-white font-medium transition-colors"
            >
              Light
            </button>
            <button
              class="flex-1 px-4 py-3 rounded-lg bg-blue-500 text-white font-medium transition-colors"
            >
              Dark
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Save button -->
    <div class="flex justify-end pt-6 border-t border-gray-200 dark:border-gray-700">
      <button
        class="px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 text-white font-semibold rounded-lg shadow-lg transition-all duration-200 hover:scale-105"
      >
        Save Changes
      </button>
    </div>
  </div>
</section>
